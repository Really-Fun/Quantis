[project]
name = "quantis"
version = "0.2.1"
description = "A scalable, plugin-based async media application."
authors = [
    {name = "ReallyFun",email = "ilyareztcov@gmail.com"}
]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.13, <3.15"
packages = [{include = "quantis", from = "src"}]
dependencies = [
    "yt-dlp (>=2026.6.9,<2027.0.0)",
    "yandex-music (>=3.0.0,<4.0.0)",
    "pyside6 (>=6.11.1,<7.0.0)",
    "ytmusicapi (>=1.12.1,<2.0.0)",
    "qasync (>=0.28.0,<0.29.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "aiohttp (>=3.14.1,<4.0.0)",
    "keyring (>=25.7.0,<26.0.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "mpris-server>=0.9.6; sys_platform == 'linux'",
    "winrt-Windows.media>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.media.playback>=3.2.1; sys_platform == 'win32'",
    "winrt-Windows.foundation>=3.2.1; sys_platform == 'win32'",
]

[project.scripts]
quantis = "quantis.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pyinstaller (>=6.21.0,<7.0.0)",
    "Pillow"
]
vlc = [
    "python-vlc (>=3.0.21203,<4.0.0)",
]
dj = [
    "edge-tts (>=7.0.0,<8.0.0)",
]

[tool.pytest.ini_options]
markers = [
    "network: тесты, требующие активного интернет-соединения и интеграции с внешними API"
]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true