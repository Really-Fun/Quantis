      <rect class="edge" style="animation-delay:3.6s" x="24.0" y="364" width="566.0" height="150" rx="20"/>
      <rect class="badge-glow" style="animation-delay:3.6s" x="52.0" y="407.0" width="64" height="64" rx="18" fill="url(#ring)" filter="url(#badgeBlur)"/>
      <rect x="52.0" y="407.0" width="64" height="64" rx="18" fill="url(#ring)"/>
      <g class="icon" transform="translate(66.0 421.0) scale(1.5)"><path d="M12 21a9 9 0 1 1 9-9c0 2.5-2 3.5-3.6 3.5H15.6a1.8 1.8 0 0 0-1.3 3.1c.6.7.1 2.4-2.3 2.4z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></g>
      <text class="title" x="140.0" y="420">Шесть тем</text>
      <text class="desc" x="140.0" y="452">Акцентный цвет подстраивается</text>
      <text class="desc" x="140.0" y="476">под обложку того, что играет.</text>
    </g>
    <g>
      <rect class="card" x="610.0" y="364" width="566.0" height="150" rx="20"/>
      <g clip-path="url(#c5)"><g transform="translate(610.0 364)">
        <rect class="shine" style="animation-delay:4.5s" x="0" y="-40" width="220" height="230" fill="url(#shineG)" transform-origin="0 0"/>
      </g></g>
      <rect class="edge" style="animation-delay:4.5s" x="610.0" y="364" width="566.0" height="150" rx="20"/>
      <rect class="badge-glow" style="animation-delay:4.5s" x="638.0" y="407.0" width="64" height="64" rx="18" fill="url(#ring)" filter="url(#badgeBlur)"/>
      <rect x="638.0" y="407.0" width="64" height="64" rx="18" fill="url(#ring)"/>
      <g class="icon" transform="translate(652.0 421.0) scale(1.5)"><path d="M3 3v18h18"/><path d="M8 16v-4"/><path d="M12.5 16V8"/><path d="M17 16v-6"/></g>
      <text class="title" x="726.0" y="420">Статистика</text>
      <text class="desc" x="726.0" y="452">Часы прослушивания, любимый исполнитель,</text>
      <text class="desc" x="726.0" y="476">самые заслушанные треки.</text>
    </g>
    <g>
      <rect class="card" x="24.0" y="534" width="566.0" height="150" rx="20"/>
      <g clip-path="url(#c6)"><g transform="translate(24.0 534)">
        <rect class="shine" style="animation-delay:5.4s" x="0" y="-40" width="220" height="230" fill="url(#shineG)" transform-origin="0 0"/>
      </g></g>
      <rect class="edge" style="animation-delay:5.4s" x="24.0" y="534" width="566.0" height="150" rx="20"/>
      <rect class="badge-glow" style="animation-delay:5.4s" x="52.0" y="577.0" width="64" height="64" rx="18" fill="url(#ring)" filter="url(#badgeBlur)"/>
      <rect x="52.0" y="577.0" width="64" height="64" rx="18" fill="url(#ring)"/>
      <g class="icon" transform="translate(66.0 591.0) scale(1.5)"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></g>
      <text class="title" x="140.0" y="590">Клавиатура и медиа-клавиши</text>
      <text class="desc" x="140.0" y="622">Горячие клавиши, SMTC на Windows</text>
      <text class="desc" x="140.0" y="646">и MPRIS на Linux.</text>
    </g>
    <g>
      <rect class="card" x="610.0" y="534" width="566.0" height="150" rx="20"/>
      <g clip-path="url(#c7)"><g transform="translate(610.0 534)">
        <rect class="shine" style="animation-delay:6.3s" x="0" y="-40" width="220" height="230" fill="url(#shineG)" transform-origin="0 0"/>
      </g></g>
      <rect class="edge" style="animation-delay:6.3s" x="610.0" y="534" width="566.0" height="150" rx="20"/>
      <rect class="badge-glow" style="animation-delay:6.3s" x="638.0" y="577.0" width="64" height="64" rx="18" fill="url(#ring)" filter="url(#badgeBlur)"/>
      <rect x="638.0" y="577.0" width="64" height="64" rx="18" fill="url(#ring)"/>
      <g class="icon" transform="translate(652.0 591.0) scale(1.5)"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><path d="M17.25 14v6.5M14 17.25h6.5"/></g>
      <text class="title" x="726.0" y="590">Плагины</text>
      <text class="desc" x="726.0" y="622">Ставятся из .zip или по ссылке и умеют</text>
      <text class="desc" x="726.0" y="646">добавлять в интерфейс свои страницы.</text>
    </g>
</svg>
