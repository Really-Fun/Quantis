name: Release build

# Собирает Windows-установщики и zip (Qt и VLC) и кладёт их в ЧЕРНОВИК
# релиза v<версия из pyproject.toml>. Дальше вручную: поправить описание →
# Publish. Тег создаётся в момент публикации, на коммите, из которого собран
# черновик.
#
# Новые пуши в main до публикации обновляют файлы в том же черновике,
# описание не трогают. Уже опубликованную версию не пересобирает — сначала
# `poetry version patch` (или свою), потом пуш.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft:
    name: Черновик релиза
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      # Черновик создаётся здесь, один раз: сборки Qt и VLC идут параллельно
      # и только докладывают в него файлы.
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$draft" in
            false)
              echo "::notice::$tag уже опубликован — сборка пропущена. Поднимите версию в pyproject.toml."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            true)
              gh release edit "$tag" --target "$GITHUB_SHA"
              ;;
            *)
              gh release create "$tag" --draft --target "$GITHUB_SHA" \
                --title "Quantis - $tag" --generate-notes
              ;;
          esac
          echo "build=true" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows (${{ matrix.backend }})
    needs: draft
    if: needs.draft.outputs.build == 'true'
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: qt
            app: Quantis
            zip: quantis
            groups: build
          - backend: vlc
            app: Quantis-VLC
            zip: quantis-vlc
            groups: build,vlc
    env:
      VERSION: ${{ needs.draft.outputs.version }}
      TAG: ${{ needs.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install
        run: poetry install --with ${{ matrix.groups }} --no-interaction

      # Стоковый runw.exe общий у тысяч неподписанных сборок — антивирусы
      # чаще ругаются. MSVC на раннере есть, см. docs/build.md.
      - name: Свой bootloader PyInstaller
        shell: pwsh
        run: .\packaging\scripts\rebuild_pyi_bootloader.ps1

      - name: VLC
        if: matrix.backend == 'vlc'
        shell: pwsh
        run: |
          choco install vlc --no-progress -y
          $vlc = "$env:ProgramFiles\VideoLAN\VLC"
          if (-not (Test-Path "$vlc\libvlc.dll")) { throw "libvlc.dll не найден в $vlc" }
          "VLC_HOME=$vlc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: PyInstaller
        run: poetry run python packaging/scripts/build_exe.py ${{ matrix.backend }}

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) {
              choco install innosetup --no-progress -y
            }
            $env:PATH = "$inno;$env:PATH"
          }
          poetry run python packaging/scripts/build_installer.py --backend ${{ matrix.backend }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\${{ matrix.app }}" -DestinationPath "dist\installer\${{ matrix.zip }}-v$env:VERSION.zip"
          Get-ChildItem dist\installer | Format-Table Name, Length

      - name: Файлы в черновик
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" --clobber \
            "dist/installer/${{ matrix.app }}-$VERSION-setup.exe" \
            "dist/installer/${{ matrix.zip }}-v$VERSION.zip"
          echo "### ${{ matrix.app }} → черновик $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"
