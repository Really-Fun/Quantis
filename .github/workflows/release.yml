name: Release build

# Собирает Windows-установщик и portable-zip и кладёт их в ЧЕРНОВИК релиза
# v<версия из pyproject.toml>. Дальше вручную: поправить описание → Publish.
# Тег создаётся в момент публикации, на коммите, из которого собран черновик.
#
# Новые пуши в main до публикации обновляют файлы в том же черновике,
# описание не трогают. Уже опубликованную версию не пересобирает — сначала
# `poetry version patch` (или свою), потом пуш.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  version:
    name: Версия и статус релиза
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = "false" ]; then
            echo "::notice::$tag уже опубликован — сборка пропущена. Поднимите версию в pyproject.toml."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (Qt) → черновик ${{ needs.version.outputs.tag }}
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry

      - name: Install
        run: poetry install --with build --no-interaction

      - name: PyInstaller
        run: poetry run python packaging/scripts/build_exe.py qt

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) {
              choco install innosetup --no-progress -y
            }
            $env:PATH = "$inno;$env:PATH"
          }
          poetry run python packaging/scripts/build_installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Quantis -DestinationPath "dist\installer\Quantis-$env:VERSION-win64-portable.zip"
          Get-ChildItem dist\installer | Format-Table Name, Length

      - name: Черновик релиза
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/installer/Quantis-"$VERSION"-setup.exe dist/installer/Quantis-"$VERSION"-win64-portable.zip)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Quantis - $TAG" \
              --generate-notes
          fi
          echo "### Черновик $TAG готов" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"
