name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, black)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry

      # Только dev-группа: ruff и black не нужны PySide6 и PyGObject.
      - name: Install linters
        run: poetry install --only dev --no-root --no-interaction

      - name: ruff
        run: poetry run ruff check src tests packaging

      - name: black
        run: poetry run black --check src tests packaging

  test:
    name: Tests + mypy (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      # PyGObject (для mpris-server) собирается из исходников, Qt в offscreen
      # всё равно тянет EGL/xkb/fontconfig.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository-2.0-dev libcairo2-dev pkg-config \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: poetry

      - name: Install
        run: poetry install --with dev --no-interaction

      # mypy здесь, а не в lint: без установленного PySide6 классы Qt для
      # него Any, и strict падает. Список модулей — [tool.mypy] в pyproject.
      - name: mypy
        run: poetry run mypy

      - name: pytest
        run: poetry run pytest -m "not network" -q
